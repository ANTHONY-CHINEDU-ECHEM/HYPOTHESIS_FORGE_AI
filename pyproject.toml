[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesisforge"
version = "0.1.0"
description = "Multi-agent scientific hypothesis generator & critic (solid-state electrolyte materials)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.4,<3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "anthropic>=0.34.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]
semantic-embeddings = ["sentence-transformers>=2.2"]

[project.scripts]
hypothesisforge = "hypothesisforge.cli:main"

[tool.setuptools.packages.find]
include = ["hypothesisforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
